# 固定设置后做独立外测的文件操作示例；本数据为人工教学数据，不是实测反应。
# 外测文件单独存放、结构无完全重复，都不能赋予人工数据独立实验来源。
schema_version: "2.0"
project_name: example_external_test_20261113
stage: benchmark

dataset:
  path: ./dataset/train.csv   # 12条教学记录，全部用来建立模型
  sample_id_col: reaction_id
  column_roles:
    label: yield             # 人工参考产率，0.12表示12%
    reactants: [amine_smiles, acid_smiles]
    products: [product_smiles]
    others: []
    conditions: []
    categoricals: []
  numeric_conditions:
    defaults:
      missing: {strategy: error}
      scaling: none
    columns: {}

descriptors:
  - id: morgan
    descriptor: morgan
    lifecycle: static_descriptor
    mode: concat
    columns: [amine_smiles, acid_smiles, product_smiles]

artifacts:
  output_dir: ./result/example_external_test_20261113/feature

models: [rf]
model_params:
  rf:
    estimator:
      n_estimators: 10        # 开始外测前固定；小型教学预算
      n_jobs: 19
      random_state: 42

hpo:
  enabled: false             # 外测数据不能用于比较或筛选模型设置

evaluation:
  protocol: frozen_train_external_test  # 训练全部完成，再评价另一批数据
  seed: 42
  # 本协议没有n_splits、n_repeats、shuffle、grouping或split_manifest。
  external_test:
    path: ./dataset/external.csv
    sample_id_col: external_id
    label_col: measured_yield # 只是演示真实项目的列名；本例数值人工编造
    source_id_col: source_record_id  # 带来源前缀的唯一记录编号
    group_col: amine_group    # 标识外测3个胺组；当前报告只列组数，后续分析可据此分组
    column_map:              # 左边为训练列，右边为外测CSV对应列
      amine_smiles: external_amine
      acid_smiles: external_acid
      product_smiles: external_product
    expected_sha256: 1801f2879cc2486983cfc5c33ab0c5b7fe26f18bbe1f91766e52d9f1dc06e44f
    audit_manifest: ./audit/external_audit.json
    audit_manifest_sha256: e4145e45f41d95003509380960496a1b43b0ef86290f9ed0d72fcf5066b1be77

outputs:
  root: ./result/example_external_test_20261113
  report_formats: [html, markdown]

benchmark:
  task_state:
    backend: sqlite
    resumable: true
  population_id: teaching_development_12_records_v1
  dataset_id: synthetic_external_teaching_v1

metadata:
  notes: "12条训练+6条外测人工教学记录；A/B/P结构零交集已实际检查；不具备独立实验来源；执行状态见verification.json。"
