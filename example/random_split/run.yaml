# 随机划分教学示例：12条人工记录，不是实验测量数据。
# 本目录report/保留历史报告；本配置的新计算输出保存在本目录result/。
# 从本文件夹启动python ../../yonod.py，首提示输入run.yaml，无需复制配置。
schema_version: "2.0"
project_name: example_random_split_20261113
stage: all  # 先准备输入编码，再建立模型并做内测

dataset:
  path: ./dataset/reactions.csv
  sample_id_col: reaction_id  # 每条反应记录的唯一编号
  column_roles:
    label: yield             # 教学参考产率，0.10表示10%；不作为模型输入
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []           # 本例不使用温度等数值条件
    categoricals: []
  numeric_conditions:
    defaults:
      missing: {strategy: error}
      scaling: none
    columns: {}

descriptors:
  - id: morgan
    descriptor: morgan       # 将分子结构转为数值编码
    mode: concat             # 按列顺序合并两个组分的编码
    columns: [reactant_1_smiles, reactant_2_smiles]

artifacts:
  output_dir: ./result/example_random_split_20261113/feature

models: [rf, xgb, lightgbm]   # 同一数据、同一划分，比较三种建模方法
model_params:
  rf:
    estimator:
      n_estimators: 2         # 与历史教学任务相同的小型设置，不是推荐研究参数
      n_jobs: 19
      random_state: 42
  xgb:
    estimator:
      n_estimators: 2
      max_depth: 2
      learning_rate: 0.1
      n_jobs: 19
      random_state: 42
  lightgbm:
    estimator:
      n_estimators: 2
      num_leaves: 2
      min_child_samples: 1
      n_jobs: 19
      random_state: 42

hpo:
  enabled: false             # 不自动比较模型设置，更不优化反应条件

evaluation:
  protocol: outer_kfold      # 随机分批轮换内测
  n_splits: 2                # 分两份，每次6条建模、6条检验，再交换
  n_repeats: 1               # 整套内测只做一次
  shuffle: true              # 划分前打乱记录顺序
  seed: 42                   # 固定打乱方式；不表示未见底物或独立外测

outputs:
  root: ./result/example_random_split_20261113
  report_formats: [html, markdown]
  diagnostics:
    enabled: false           # 与历史报告一致，不另算已学反应效果对照
    save_train_predictions: false

metadata:
  notes: "人工教学数据；模型与划分设置对应历史任务diag215_20260929_ordinary_fixed_off_v1；当前配置可从本目录独立启动；结果写入本目录result。"
