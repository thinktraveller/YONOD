name: chemspace
channels:
  - conda-forge
channel_priority: strict

dependencies:
  # ---- Python core ----
  - python=3.10

  # ---- Chemistry / Scientific stack (conda only) ----
  - rdkit
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13

  # ---- Jupyter / Notebook ----
  - jupyterlab>=4.0
  - ipykernel


  # ---- Utilities ----
  - joblib>=1.3
  - tqdm

  # ---- pip-only packages (application layer) ----
  - pip
  - pip:
      - streamlit>=1.32
      - plotly
      - xgboost>=2.0
      - umap-learn>=0.5.5
