version: 1
models:
  rf:
    stage: A
    class: RandomForestRegressor
    params:
      n_estimators: 200
      random_state: 42
      n_jobs: -1
      min_samples_leaf: 1
  ridge:
    stage: C
    class: Ridge
    alpha_grid: [0.1, 1.0, 10.0]
  knn:
    stage: C
    class: KNeighborsRegressor
    n_neighbors_grid: [3, 5, 11]
  lightgbm:
    stage: C
    class: LGBMRegressor
    status: optional

