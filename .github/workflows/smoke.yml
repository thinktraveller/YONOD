              def test_dynamic_or_nested_configuration_fails_even_with_explicit_pins(self):
                  changes = [
                      {"auto_map": {"AutoModel": "unapproved.Model"}},
                      {"configuration_files": ["config.any.json"]},
                      {"_attn_implementation_internal": "unapproved/kernel"},
                      {"_experts_implementation_internal": "unapproved/kernel"},
                      {"trust_remote_code": True}, {"attn_implementation": "unapproved/kernel"},
                      {"kernel_config": {}}, {"keypoint_detector_config": {"model_type": "lightglue"}},
                      {"rope_scaling": {"model_type": "lightglue"}},
                      {"model_type": "lightglue"}, {"architectures": ["OtherModel"]},
                      {"hidden_size": 1024}, {"torch_dtype": "float16"},
                  ]
                  original = copy.deepcopy(self.data["config.json"])
                  for change in changes:
                      self.data["config.json"] = dict(original, **change)
                      self.write_metadata()
                      with self.subTest(change=change):
                          self.rejected_before_loading()
                  self.data["config.json"] = original
                  for change in ({"chat_template": {"unapproved": "text"}}, {"tokenizer_class": "MarianTokenizer"}, {"added_tokens_decoder": {"0": {"auto_map": {}}}}):
                      self.data["tokenizer_config.json"] = {"tokenizer_class": "BertTokenizer", **change}
                      self.write_metadata()
                      with self.subTest(change=change):
                          self.rejected_before_loading()

              def test_malformed_json_duplicate_keys_and_nonfinite_values(self):
                  for raw in ('{"model_type":"llama","model_type":"lightglue"}', '["not-an-object"]', '{', '{"value": NaN}'):
                      (self.root / "config.json").write_text(raw, encoding="utf-8")
                      with self.subTest(raw=raw):
                          self.rejected_before_loading()

              def test_extra_loader_inputs_and_unsafe_formats_are_rejected(self):
                  for name in ("pytorch_model.bin", "adapter_config.json", "config.other.json", "model.safetensors.index.json", "modeling_custom.py"):
                      path = self.root / name
                      path.write_text("harmless test fixture", encoding="utf-8")
                      with self.subTest(name=name):
                          self.rejected_before_loading()
                      path.unlink()
                  path = self.root / "chat_templates"
                  path.mkdir()
                  self.rejected_before_loading()

              def test_pinned_file_symlink_is_rejected(self):
                  target = self.root.parent / "external-vocab.txt"
                  target.write_bytes((self.root / "vocab.txt").read_bytes())
                  pins = self.pins()
                  (self.root / "vocab.txt").unlink()
                  try:
                      (self.root / "vocab.txt").symlink_to(target)
                  except OSError as exc:
                      self.skipTest("OS did not permit creating a symlink: " + str(exc))
                  self.rejected_before_loading(pins)

              def test_loader_failure_is_not_retried_or_published(self):
                  for loader in (self.token_loader, self.model_loader):
                      self.token_loader.reset_mock()
                      self.model_loader.reset_mock()
                      loader.side_effect = OSError("harmless simulated corrupted asset")
                      descriptor = self.descriptor()
                      with self.subTest(loader=loader), self.assertRaises(OSError):
                          descriptor._load()
                      self.causal_loader.assert_not_called()
                      self.assertIsNone(descriptor._model)
                      self.assertIsNone(descriptor._tokenizer)
                      if loader is self.token_loader:
                          self.model_loader.assert_not_called()
                      loader.side_effect = None

              def test_loaded_profile_mismatch_is_rejected(self):
                  self.model.config.hidden_size = 1024
                  descriptor = self.descriptor()
                  with self.assertRaises(MolMetaLMAssetError):
                      descriptor._load()
                  self.assertIsNone(descriptor._model)
                  self.assertIsNone(descriptor._tokenizer)
                  self.model.to.assert_not_called()
                  self.causal_loader.assert_not_called()

              def test_device_failure_does_not_publish_partial_state(self):
                  descriptor = self.descriptor()
