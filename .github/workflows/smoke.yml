          import importlib.metadata
          import json
          import platform
          import re
          import sys
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import yaml

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT))
          EXPECTED_TRANSFORMERS = "4.57.6+yonod.sec2"
          SMILES = ["CCO", "CC", "CCC", "CCO", "CC", "CCC"]


          def require(condition, message):
              if not condition:
                  raise AssertionError(message)


          def sha(path):
              digest = hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()


          def write(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")


          def locations(name):
              require(re.fullmatch(r"[A-Za-z][A-Za-z0-9_-]*", name), "Use an ASCII task name without separators")
              return ROOT / "backup" / "molmetalm_candidate_20261115" / name


          def prepare(name, profile="molmetalm"):
              from yonod.config.loader import load_run_config

              evidence = locations(name)
              require(not (evidence / "prepared.json").exists(), "Already prepared; use a unique task name")
              target, config_path = ROOT / "result" / name, ROOT / "config" / (name + ".yaml")
              require(not target.exists() and not config_path.exists(), "Refusing to overwrite a task")
              evidence.mkdir(parents=True, exist_ok=True)
              data = evidence / "artificial_smiles.csv"
              with data.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=["sample_id", "smiles", "yield"], lineterminator="\n")
                  writer.writeheader()
                  for index, smiles in enumerate(SMILES):
                      writer.writerow({"sample_id": "smoke-" + str(index), "smiles": smiles, "yield": 0.15 + index * 0.1})
              descriptor, width, params = profile, 768, {}
              if profile == "fisd":
                  width = 50
              elif profile in {"zinc", "zinc_properties"}:
                  asset = {"zinc": "zinc-37e96cd3bc8f9680", "zinc_properties": "zinc_properties-9f923d03c5ce558d"}[profile]
                  descriptor, width = "chemical_vae", 196
                  params = {"model_manifest": "./WEIGHTS/chemical_vae/" + asset + "/v5/conversion_manifest.json",
                            "backend": "pytorch", "device": "cpu", "batch_size": 3,
                            "input_preprocessing": "identity", "output": "z_mean_sample"}
              config = {
                  "schema_version": "2.0", "project_name": name, "stage": "all",
                  "dataset": {"path": "./" + data.relative_to(ROOT).as_posix(), "sample_id_col": "sample_id",
                              "column_roles": {"label": "yield", "reactants": ["smiles"], "products": [],
                                               "others": [], "conditions": [], "categoricals": []}},
                  "descriptors": [{"id": descriptor, "descriptor": descriptor, "lifecycle": "static_descriptor",
                                   "mode": "concat", "columns": ["smiles"], "params": params}],
                  "artifacts": {"output_dir": "./result/" + name + "/feature"},
                  "models": ["rf"], "model_params": {"rf": {"estimator": {"n_estimators": 4, "random_state": 42, "n_jobs": 1}}},
                  "hpo": {"enabled": False},
                  "evaluation": {"protocol": "outer_kfold", "n_splits": 2, "n_repeats": 1, "seed": 42, "shuffle": True},
                  "outputs": {"root": "./result/" + name, "report_formats": ["html", "markdown"]},
                  "metadata": {"notes": "Six artificial valid SMILES; CPU descriptor/API acceptance only, no research claim."},
              }
              config_path.parent.mkdir(exist_ok=True)
              config_path.write_text(yaml.safe_dump(config, allow_unicode=True, sort_keys=False), encoding="utf-8")
              load_run_config(config_path)
              record = {"task_name": name, "config": config_path.relative_to(ROOT).as_posix(),
                        "config_sha256": sha(config_path), "dataset": data.relative_to(ROOT).as_posix(),
                        "dataset_sha256": sha(data), "expected_rows": 6, "expected_width": width,
                        "descriptor": descriptor, "profile": profile,
                        "duplicate_tolerance": ({"max_absolute": 2e-5, "relative_l2": 1e-5}
                                                if profile == "molmetalm" else {"rtol": 1e-6, "atol": 1e-6}),
                        "expected_transformers": EXPECTED_TRANSFORMERS,
                        "modeling_execution_performed": False}
              write(evidence / "prepared.json", record)
              print(record["config"])


          def accept(name):
              import torch
              from yonod.artifacts.reader import load_feature_artifact

              evidence = locations(name)
              record = json.loads((evidence / "prepared.json").read_text(encoding="utf-8"))
              checks = []

              def check(condition, message):
                  require(condition, message)
                  checks.append(message)

              check(importlib.metadata.version("transformers") == EXPECTED_TRANSFORMERS, "audited fork installed")
              check(not torch.cuda.is_available(), "CPU-only candidate runtime")
              check(sha(ROOT / record["config"]) == record["config_sha256"], "saved YAML unchanged")
              check(sha(ROOT / record["dataset"]) == record["dataset_sha256"], "artificial input unchanged")
              identity = {}
              if record["profile"] == "molmetalm":
                  from yonod.descriptors.molmetalm import DEFAULT_WEIGHT_PATH
                  from yonod.descriptors.molmetalm_assets import validated_asset_identity
                  identity = validated_asset_identity(DEFAULT_WEIGHT_PATH)
              else:
                  if record["profile"] == "fisd":
                      files = [ROOT / "WEIGHTS/FISD" / name for name in
                               ["qm_9_2in1_model.pth", "qm_9_cos_model.pth", "qm_9_mse_model.pth"]]
                  else:
                      asset = {"zinc": "zinc-37e96cd3bc8f9680", "zinc_properties": "zinc_properties-9f923d03c5ce558d"}[record["profile"]]
                      base = ROOT / "WEIGHTS/chemical_vae" / asset / "v5"
                      files = [base / "conversion_manifest.json", base / "encoder_state_dict.pt"]
