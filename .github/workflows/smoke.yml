    - name: '[dependency] materialize ci_dependency_fork_20261115.py 1/1 (Bash)'
      if: runner.os != 'Windows'
      shell: bash -el {0}
      run: |
        source "$(conda info --base)/etc/profile.d/conda.sh"
        conda activate yonod
        [ "$CONDA_DEFAULT_ENV" = "yonod" ]
        python -c "import os,hashlib; from pathlib import Path; p=Path('_verify/ci_dependency_fork_20261115.py'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(os.environ['YONOD_CI_CHUNK'].encode('utf-8')); assert hashlib.sha256(p.read_bytes()).hexdigest() == '97c3aac18cfb48a3ac1580ececb88c11dc17b0ada365808c7fb6a5b05b4c0e36', 'Materialized program SHA mismatch'"
      env:
        YONOD_CI_CHUNK: |
          """Install an immutable CI fork wheel after independent SHA-256 verification."""
          from __future__ import annotations

          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from urllib.parse import unquote, urlsplit

          from ci_dependency_assets_20261115 import download_verified

          ROOT = Path(__file__).resolve().parents[1]
          EXPECTED_VERSION = "4.57.6+yonod.sec2"


          def main():
              if Path.cwd().resolve() != ROOT or os.environ.get("CONDA_DEFAULT_ENV") != "yonod" or sys.version_info[:2] != (3, 9):
                  raise AssertionError("Run from repository root in yonod / Python3.9")
              url = os.environ["YONOD_HF_FORK_URL"]
              digest = os.environ["YONOD_HF_FORK_SHA256"]
              count = int(os.environ["YONOD_HF_FORK_BYTES"])
              parts = urlsplit(url)
              name = unquote(parts.path.rsplit("/", 1)[-1])
              if (
                  parts.scheme != "https" or parts.netloc != "github.com" or parts.query or parts.fragment
                  or not parts.path.startswith("/thinktraveller/transformers-yonod-sec/releases/download/")
                  or name != "transformers-4.57.6+yonod.sec2-py3-none-any.whl"
                  or re.fullmatch(r"[a-f0-9]{64}", digest) is None or not 1 <= count <= 32 * 1024 * 1024
              ):
                  raise AssertionError("Fork installation requires the reviewed immutable release URL, wheel name, size and SHA")
              support = ROOT / "backup" / "ci-dependency-fork"
              support.mkdir(parents=True, exist_ok=True)
              wheel = support / name
              report = {"platform": sys.platform, "source_url": url, "sha256": digest, "bytes": count,
                        "expected_version": EXPECTED_VERSION, "models_loaded": False}
              try:
                  report["downloaded"] = download_verified(url, wheel, digest, count)
                  subprocess.run([sys.executable, "-m", "pip", "install", str(wheel)], cwd=ROOT, check=True)
                  subprocess.run([sys.executable, "-m", "pip", "check"], cwd=ROOT, check=True)
                  installed = importlib.metadata.version("transformers")
                  if installed != EXPECTED_VERSION:
                      raise AssertionError("Unexpected installed Transformers version: " + installed)
                  report["installed_version"] = installed
                  report["status"] = "passed"
              except Exception as exc:
                  report["status"] = "failed"
                  report["error"] = type(exc).__name__ + ": " + str(exc)
                  raise
              finally:
                  (support / "installation.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(report, ensure_ascii=False))


          if __name__ == "__main__":
              main()
