      if: runner.os != 'Windows'
      shell: bash -el {0}
      run: |
        source "$(conda info --base)/etc/profile.d/conda.sh"
        conda activate yonod
        [ "$CONDA_DEFAULT_ENV" = "yonod" ]
        python -c "import os,hashlib; from pathlib import Path; p=Path('_verify/verify_molmetalm_tokenization_20261115.py'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(os.environ['YONOD_CI_CHUNK'].encode('utf-8'))"
      env:
        YONOD_CI_CHUNK: |-
          """Real approved tokenizer + inert encoder tests; no pretrained model loading.

          The author contract is character spacing, not a generic SMILES atom regex:
          https://github.com/CSUBioGroup/MolMetaLM/blob/9b956408483c385949ddecaef0452fcb999de896/utils.py#L862
          """
          from __future__ import annotations

          from contextlib import redirect_stderr
          import hashlib
          import importlib.metadata
          import io
          import json
          import os
          from pathlib import Path
          import platform
          import socket
          import sys
          from types import SimpleNamespace
          import unittest
          from unittest import mock

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT))
          # Keep this small serial check from starting native tokenizer thread workers
          # before Torch's environment probes; this also avoids fork-after-threads hazards.
          os.environ.setdefault("TOKENIZERS_PARALLELISM", "false")

          import numpy as np
          from yonod.descriptors.molmetalm import DEFAULT_WEIGHT_PATH, MolMetaLMDescriptor
          from yonod.descriptors.molmetalm_assets import (
              INPUT_PREPROCESSING_POLICY, character_spaced_smiles, validated_asset_identity,
          )


          class TokenizationTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.network = mock.patch.object(socket.socket, "connect", side_effect=AssertionError("No network is permitted"))
                  cls.network.start()
                  cls.addClassCleanup(cls.network.stop)
                  cls.assets = validated_asset_identity(DEFAULT_WEIGHT_PATH)
                  from transformers import AutoTokenizer
                  cls.tokenizer = AutoTokenizer.from_pretrained(
                      DEFAULT_WEIGHT_PATH, local_files_only=True, trust_remote_code=False, use_fast=True,
                  )

              def descriptor(self):
                  import torch

                  descriptor = MolMetaLMDescriptor(device="cpu")
                  descriptor._tokenizer = self.tokenizer
                  descriptor._torch = torch
                  calls = []

                  class InertEncoder:
                      def __call__(self, input_ids, attention_mask):
                          calls.append(input_ids.detach().cpu().numpy().tolist())
                          # No neural network or pretrained weight: each token ID is
                          # repeated as a vector so padding/row handling can be checked.
                          hidden = input_ids.float().unsqueeze(-1).expand(-1, -1, 768)
                          return SimpleNamespace(last_hidden_state=hidden)

                  descriptor._model = InertEncoder()
                  return descriptor, calls

              def test_author_character_policy_and_fast_special_token_boundary(self):
                  self.assertEqual(INPUT_PREPROCESSING_POLICY, "author-char-whitespace-fast-truncate512-reject-unk/v1")
                  self.assertEqual(MolMetaLMDescriptor.input_preprocessing_policy, INPUT_PREPROCESSING_POLICY)
                  self.assertEqual(character_spaced_smiles("ClCBr"), "C l C B r")
                  self.assertEqual(character_spaced_smiles("[NH4+]"), "[ N H 4 + ]")
                  self.assertEqual(character_spaced_smiles("C%12"), "C % 1 2")
                  self.assertTrue(self.tokenizer.is_fast)
                  self.assertEqual(self.tokenizer.unk_token_id, 3)
                  self.assertEqual(self.tokenizer.num_special_tokens_to_add(pair=False), 0)
                  self.assertEqual(self.tokenizer.encode("C C O", add_special_tokens=True), [26, 26, 37])

              def test_regression_raw_smiles_collapse_but_character_inputs_do_not(self):
                  # This asserts different token sequences, not injective embeddings.
                  # Repeated C under RoPE + mean pooling can legitimately collide for
                  # CC/CCC; adding CLS or changing pooling to force separation is wrong.
                  expected = {"CCO": [26, 26, 37], "CC": [26, 26], "CCC": [26, 26, 26]}
                  for smiles, ids in expected.items():
                      with self.subTest(smiles=smiles):
                          self.assertEqual(self.tokenizer.encode(smiles), [3])
                          self.assertEqual(self.tokenizer.encode(character_spaced_smiles(smiles)), ids)
                  self.assertEqual(self.tokenizer.encode(character_spaced_smiles("ClCBr")), [26, 61, 26, 25, 66])
                  self.assertEqual(self.tokenizer.encode(character_spaced_smiles("[NH4+]")), [48, 36, 31, 16, 8, 50])

              def test_complete_character_coverage_and_unsupported_rows(self):
                  descriptor, calls = self.descriptor()
                  samples = ["CCO", "C%12CCCCC%12", "CC", "[CH3:1]", "*", "c1ccccc1", "[NH4+]", "C\tC", "C" * 600 + "%"]
                  diagnostics = io.StringIO()
                  with redirect_stderr(diagnostics):
                      indices, texts = descriptor._prepare_texts(samples)
                  self.assertEqual(indices, [0, 2, 5, 6])
                  self.assertEqual(texts, [character_spaced_smiles(samples[index]) for index in indices])
                  self.assertIn("rejected batch row", diagnostics.getvalue())
                  self.assertEqual(calls, [])

              def test_unknown_rows_do_not_drop_valid_peers_or_forward_all_unknown_batch(self):
                  descriptor, calls = self.descriptor()
                  with redirect_stderr(io.StringIO()):
                      features, valid = descriptor.featurize(["CCO", "*", "CC", "C%12CCCCC%12", "[NH4+]", ""])
                  np.testing.assert_array_equal(valid, [True, False, True, False, True, False])
                  self.assertEqual(features.shape, (6, 768))
                  self.assertEqual(features.dtype, np.dtype("float32"))
                  self.assertTrue(np.all(features[~valid] == 0))
                  self.assertEqual(len(calls), 1)
                  self.assertEqual(len(calls[0]), 3)
                  self.assertFalse(any(3 in row for row in calls[0]))
                  calls.clear()
                  with redirect_stderr(io.StringIO()):
                      _, valid = descriptor.featurize(["*", "C%12CCCCC%12"])
                  self.assertFalse(valid.any())
                  self.assertEqual(calls, [])

              def test_masked_mean_and_explicit_truncation_are_retained(self):
                  descriptor, calls = self.descriptor()
                  features, valid = descriptor.featurize(["CCO", "C"])
                  self.assertTrue(valid.all())
                  np.testing.assert_allclose(features[0], np.mean([26, 26, 37]), rtol=0, atol=2e-6)
                  np.testing.assert_array_equal(features[1], np.full(768, 26, dtype=np.float32))
                  self.assertEqual(calls[0][1], [26, 0, 0])
                  diagnostics = io.StringIO()
                  with redirect_stderr(diagnostics):
                      features, valid = descriptor.featurize(["C" * 600, "CCO"])
                  self.assertTrue(valid.all())
                  self.assertIn("explicit max_length=512 truncation", diagnostics.getvalue())
                  self.assertEqual(len(calls[-1][0]), 512)
                  self.assertEqual(len(calls[-1][1]), 512)
                  np.testing.assert_array_equal(features[0], np.full(768, 26, dtype=np.float32))

              def test_actual_batch_unk_is_rejected_before_inert_encoder(self):
                  descriptor, calls = self.descriptor()
                  approved = self.tokenizer

                  class AlteredBatch:
                      def __getattr__(self, name):
                          return getattr(approved, name)

                      def __call__(self, *args, **kwargs):
                          batch = approved(*args, **kwargs)
                          batch["input_ids"][0, 0] = approved.unk_token_id
                          return batch

                  descriptor._tokenizer = AlteredBatch()
                  with redirect_stderr(io.StringIO()):
                      features, valid = descriptor.featurize(["CCO", "CC"])
                  np.testing.assert_array_equal(valid, [False, True])
                  self.assertTrue(np.all(features[0] == 0))
