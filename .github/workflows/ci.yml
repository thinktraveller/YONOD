# Generated verifier bodies are maintained here; _verify/ stays local.
# Node24 actions: official release tags resolved on 2026-11-15.
# actions/checkout v7.0.1: https://github.com/actions/checkout/blob/3d3c42e5aac5ba805825da76410c181273ba90b1/action.yml
# actions/upload-artifact v7.0.2: https://github.com/actions/upload-artifact/blob/cf430e030ddbb5b0abf93d22962f4752f3646cd9/action.yml
# conda-incubator/setup-miniconda v4.1.0: https://github.com/conda-incubator/setup-miniconda/blob/be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb/action.yml
name: YONOD CI
'on':
  push:
    branches:
    - main
    - codex/**
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  MPLBACKEND: Agg
jobs:
  static:
    name: YONOD static (Python 3.9)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Create Conda yonod / Python 3.9
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb
      with:
        miniforge-version: latest
        activate-environment: yonod
        python-version: '3.9'
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: true
        auto-activate: false
    - name: Install explicit static-only dependencies
      shell: bash -el {0}
      run: |
        source "$(conda info --base)/etc/profile.d/conda.sh"
        conda activate yonod
        [ "$CONDA_DEFAULT_ENV" = "yonod" ]
        python -m pip install numpy==1.26.4 pandas==2.0.3 pyyaml==6.0.1
    - name: Materialize verifier under _verify (Bash)
      if: runner.os != 'Windows'
      shell: bash -el {0}
      env:
        YONOD_CI_PROGRAM: |
          """Public-clone static contract checks; no model construction or private docs."""
          import ast
          import copy
          import csv
          import hashlib
          import importlib.util
          from contextlib import redirect_stderr, redirect_stdout
          from io import StringIO
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          from unittest.mock import patch

          ROOT = Path.cwd().resolve()
          sys.path.insert(0, str(ROOT))
          from yonod.config.contracts import resolve_config_path
          from yonod.config.loader import ConfigLoadError, load_run_config, load_yaml_mapping
          import yaml

          CHECKS = []
          NAMES = ("random_split_test", "fixed_split_test", "external_test")
          CONFIGS = [Path("example.yaml")] + [Path("config/example") / name / "run.yaml" for name in NAMES]


          def check(condition, message):
              if not condition:
                  raise AssertionError(message)
              CHECKS.append(message)


          def fingerprint(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def validate_config(relative):
              loaded = load_run_config(ROOT / relative)
              config = loaded.effective
              source = resolve_config_path(loaded.path, config["dataset"]["path"])
              output = resolve_config_path(loaded.path, config["outputs"]["root"])
              artifacts = resolve_config_path(loaded.path, config["artifacts"]["output_dir"])
              name = "yonod_schema2_smoke" if relative == Path("example.yaml") else relative.parent.name
              check(source.is_file(), str(relative) + ": input exists")
              check(output == ROOT / "result/example" / name, str(relative) + ": isolated output")
              check(artifacts == output / "feature", str(relative) + ": feature child")
              check(set(config["outputs"]["report_formats"]) == {"html", "markdown"}, str(relative) + ": dual reports")
              check(set(config.get("model_params", {})) <= set(config["models"]), str(relative) + ": selected model parameters")
              with source.open(encoding="utf-8-sig", newline="") as stream:
                  rows = list(csv.DictReader(stream))
              key = config["dataset"].get("sample_id_col")
              if key:
                  ids = [row[key] for row in rows]
                  check(all(ids) and len(set(ids)) == len(ids), str(relative) + ": unique sample IDs")
              external = config["evaluation"].get("external_test", {})
              for field, digest in (("path", "expected_sha256"), ("audit_manifest", "audit_manifest_sha256")):
                  if field in external:
                      check(fingerprint(resolve_config_path(loaded.path, external[field])) == external[digest], str(relative) + ": " + field + " hash")
              return loaded


          def main():
              check(os.environ.get("CONDA_DEFAULT_ENV") == "yonod", "Conda yonod active")
              check(sys.version_info[:2] == (3, 9), "Python 3.9 baseline")
              tracked = subprocess.check_output(["git", "ls-files", "-z"], cwd=ROOT).decode("utf-8").split("\0")[:-1]
              for name in tracked:
                  if name.endswith(".py"):
                      ast.parse((ROOT / name).read_text(encoding="utf-8-sig"), filename=name)
                      CHECKS.append("Python syntax: " + name)
              check(not any(Path(p).parts[0] in {"project-docs", "backup", "_verify", "reference-projects", "docs", "scripts"} for p in tracked), "private/support directories untracked")
              check({p for p in tracked if p.startswith("config/")} == {str(p).replace(os.sep, "/") for p in CONFIGS[1:]}, "three tracked example YAMLs only")
              check({p for p in tracked if p.startswith("result/")} == {"result/example/" + n + "/.gitkeep" for n in NAMES}, "three tracked result placeholders only")
              check(len(set(p.casefold() for p in tracked)) == len(tracked), "no case-insensitive filename collision")
              for relative in CONFIGS:
                  validate_config(relative)
              root_yaml = (ROOT / "example.yaml").read_text(encoding="utf-8")
              for name in ("fixed_split_test", "external_test"):
                  check("config/example/" + name + "/run.yaml" in root_yaml, "current root YAML navigation: " + name)
              for probe in ("result/example/random_split_test/metrics.csv", "result/example/fixed_split_test/docs/predictions/a.parquet", "result/example/external_test/report/report.html", "result/example/yonod_schema2_smoke/runs/model.joblib", "config/private_ci_task.yaml", "result/private_ci_task/model.joblib"):
                  result = subprocess.run(["git", "check-ignore", "--no-index", "-q", probe], cwd=ROOT)
                  check(result.returncode == 0, "ignored runtime/private probe: " + probe)
              before = {str(p.relative_to(ROOT)): fingerprint(p) for p in (ROOT / "result/example").rglob("*") if p.is_file()}
              bad_arguments = [["--csv", "missing.csv"], ["--models", "rf"], ["--config", "example.yaml", "--csv=missing.csv"], ["--config", "example.yaml", "--rf-n-estimators=2"], ["--conf", "example.yaml"], ["--json", "missing.json"]]
              spec = importlib.util.spec_from_file_location("yonod_ci_launcher", ROOT / "yonod.py")
              launcher = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(launcher)
              for arguments in bad_arguments:
                  output = StringIO()
                  with patch.object(launcher, "_run_schema2_config", side_effect=AssertionError("unexpected model dispatch")) as dispatch, redirect_stdout(output), redirect_stderr(output):
                      try:
                          code = launcher.main(arguments)
                      except SystemExit as exc:
                          code = exc.code
                  check(code not in (None, 0), "CLI rejects " + " ".join(arguments))
                  check(dispatch.call_count == 0, "rejected CLI never dispatches: " + " ".join(arguments))
                  if "--conf" not in arguments:
                      check("generate_yaml_config.py" in output.getvalue() or "JSON" in output.getvalue(), "actionable CLI migration message")
              after = {str(p.relative_to(ROOT)): fingerprint(p) for p in (ROOT / "result/example").rglob("*") if p.is_file()}
              check(before == after, "rejected CLI has no result side effects")
              support = ROOT / "backup/ci-static"
              support.mkdir(parents=True, exist_ok=True)
              with tempfile.TemporaryDirectory(dir=support) as temporary:
                  base = Path(temporary)
                  for filename, text in (("duplicate.yaml", "a: 1\na: 2\n"), ("alias.yaml", "a: &x 1\nb: *x\n"), ("run.json", "{}")):
                      candidate = base / filename
                      candidate.write_text(text, encoding="utf-8")
                      try:
                          load_yaml_mapping(candidate)
                      except ConfigLoadError:
                          CHECKS.append("loader rejects " + filename)
                      else:
                          raise AssertionError("unsafe input accepted: " + filename)
                  # Exercise the same path and digest assertions on deliberate bad inputs.
                  raw = yaml.safe_load((ROOT / CONFIGS[3]).read_text(encoding="utf-8"))
                  raw["dataset"]["path"] = str((ROOT / "example/external_test/dataset/train.csv").resolve())
                  ext = raw["evaluation"]["external_test"]
                  ext["path"] = str((ROOT / "example/external_test/dataset/external.csv").resolve())
                  ext["audit_manifest"] = str((ROOT / "example/external_test/audit/external_audit.json").resolve())
                  for kind in ("output", "hash"):
                      bad = copy.deepcopy(raw)
                      bad["outputs"]["root"] = str(ROOT / "result/ci-negative")
                      bad["artifacts"]["output_dir"] = str(ROOT / "result/ci-negative/feature")
                      if kind == "hash":
                          bad["outputs"]["root"] = str(ROOT / "result/example" / base.name)
                          bad["artifacts"]["output_dir"] = str(ROOT / "result/example" / base.name / "feature")
                          bad["evaluation"]["external_test"]["expected_sha256"] = "0" * 64
                      path = base / "run.yaml"
                      path.write_text(yaml.safe_dump(bad), encoding="utf-8")
                      try:
                          validate_config(path.relative_to(ROOT))
                      except AssertionError as exc:
                          check(("isolated output" if kind == "output" else "path hash") in str(exc), "negative " + kind + " fails for intended reason")
                      else:
                          raise AssertionError("negative " + kind + " was accepted")
                  try:
                      ast.parse("def broken(:\n pass\n")
                  except SyntaxError:
                      CHECKS.append("negative syntax fails")
                  else:
                      raise AssertionError("invalid Python syntax accepted")
              report = {"status": "passed", "kind": "public_clone_static_only", "checks": CHECKS, "check_count": len(CHECKS), "platform": sys.platform, "python": sys.version.split()[0], "private_docs_required": False, "modeling_executed": False}
              (support / "verification.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(json.dumps({k: v for k, v in report.items() if k != "checks"}, ensure_ascii=False))


          if __name__ == "__main__":
              main()
      run: |
        source "$(conda info --base)/etc/profile.d/conda.sh"
        conda activate yonod
        [ "$CONDA_DEFAULT_ENV" = "yonod" ]
        python -c "import os; from pathlib import Path; p=Path('_verify/ci_static.py'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(os.environ['YONOD_CI_PROGRAM'],encoding='utf-8')"
    - name: Validate public-clone contracts and deliberate negative cases
      shell: bash -el {0}
      run: |
        source "$(conda info --base)/etc/profile.d/conda.sh"
        conda activate yonod
        [ "$CONDA_DEFAULT_ENV" = "yonod" ]
        python _verify/ci_static.py
    - name: '[dependency] materialize ci_dependency_assets_20261115.py 1/1 (Bash)'
      if: runner.os != 'Windows'
      shell: bash -el {0}
      run: |
        source "$(conda info --base)/etc/profile.d/conda.sh"
        conda activate yonod
        [ "$CONDA_DEFAULT_ENV" = "yonod" ]
        python -c "import os,hashlib; from pathlib import Path; p=Path('_verify/ci_dependency_assets_20261115.py'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(os.environ['YONOD_CI_CHUNK'].encode('utf-8')); assert hashlib.sha256(p.read_bytes()).hexdigest() == '61f5249da94d0ea53763056a1331a2e9b58d638a0a62113a7d0052c93744d0b1', 'Materialized program SHA mismatch'"
      env:
        YONOD_CI_CHUNK: |
          """Verify byte-preserving metadata and fetch only a missing pinned CI weight.

          The downloader writes to a temporary file, verifies the independent code pin,
          then atomically renames it. It never loads a model or trusts a local manifest.
          """
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import urllib.request

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT))
          from yonod.descriptors.molmetalm_assets import (
              DEFAULT_ASSET_SHA256, UPSTREAM_REPOSITORY, UPSTREAM_REVISION,
              validated_asset_identity,
          )

          MODEL_BYTES = 401679328
          OTHER_REPOSITORY = "thinktraveller/YONOD-weights"
          OTHER_REVISION = "861179c95ae30d0f5a17ce63a755ebe42d5db250"
          # Fixed-revision upstream LFS oids; both JSON digests were separately checked
          # against raw bytes from that revision. No directory manifest is authoritative.
          OTHER_ASSETS = [
              ("FISD/qm_9_2in1_model.pth", "28905d23e313322112c78e778079c55aec272c28f8acdc649bf3488d2e69bcd7", 3465256),
              ("FISD/qm_9_cos_model.pth", "062fca53630b028a8d973f5dd54abe604a71e169f26c6896e74f40a57b1c18be", 7555122),
              ("FISD/qm_9_mse_model.pth", "65131ef4520ce69f848cea3a5ef7d3f16ff002eee047b8a1dfea7348daa2a19b", 7555122),
              ("chemical_vae/zinc-37e96cd3bc8f9680/v5/conversion_manifest.json", "bf93a1e2321fa2c38f537bad1974660f11435651e3e3dbe8e0d41a6df9563ac2", 4388),
              ("chemical_vae/zinc-37e96cd3bc8f9680/v5/encoder_state_dict.pt", "1bf5954e66cff67895e241bb7dcfb4d719874e8a1cf9d5c6cd755a7c81d35001", 925449),
              ("chemical_vae/zinc_properties-9f923d03c5ce558d/v5/conversion_manifest.json", "55eda62cfee6e6f2dedcf6830e31282c9a78fb4cd3b441eb99efe498a4c63de8", 4421),
              ("chemical_vae/zinc_properties-9f923d03c5ce558d/v5/encoder_state_dict.pt", "794d80d1b43285c754987f0f9829df7ebe5f6a7d41d973130d771a994f28508d", 925513),
          ]


          def sha(path):
              digest = hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def verify_metadata(root):
              pins = {"MolMetaLM-base/" + name: digest for name, digest in DEFAULT_ASSET_SHA256.items() if name != "model.safetensors"}
              pins.update({name: digest for name, digest, _ in OTHER_ASSETS if name.endswith(".json")})
              names = sorted(pins)
              relative = [(Path("WEIGHTS") / name).as_posix() for name in names]
              values = subprocess.check_output(["git", "check-attr", "-z", "text", "--"] + relative, cwd=root).decode("utf-8").split("\0")[:-1]
              if len(values) != 3 * len(names):
                  raise AssertionError("Incomplete WEIGHTS Git attribute evidence")
              for path, attribute, setting in zip(values[0::3], values[1::3], values[2::3]):
                  if attribute != "text" or setting != "unset":
                      raise AssertionError("WEIGHTS byte-preserving -text rule missing: " + path)
              assets = root / "WEIGHTS"
              for name in names:
                  path = assets.joinpath(*Path(name).parts)
                  if path.is_symlink() or not path.is_file() or sha(path) != pins[name]:
                      raise AssertionError("Tracked pretrained metadata bytes differ from upstream pin: " + name)
              return [{"path": name, "sha256": pins[name]} for name in names]


          def download_verified(url, target, expected_sha256, expected_bytes, opener=urllib.request.urlopen):
              """Fetch one inert file; callers provide an independently approved digest."""
              target = Path(target)
              if target.exists() or target.is_symlink():
                  if target.is_symlink() or not target.is_file() or target.stat().st_size != expected_bytes or sha(target) != expected_sha256:
                      raise AssertionError("Existing weight differs from its approved pin; refusing to overwrite")
                  return False
              descriptor, temporary_name = tempfile.mkstemp(prefix=".yonod-weight-", suffix=".download", dir=target.parent)
              temporary = Path(temporary_name)
              try:
                  digest, count = hashlib.sha256(), 0
                  request = urllib.request.Request(url, headers={"User-Agent": "YONOD-CI/pinned-assets"})
                  with os.fdopen(descriptor, "wb") as stream, opener(request, timeout=90) as response:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          count += len(chunk)
                          if count > expected_bytes:
                              raise AssertionError("Weight download exceeded approved file size")
                          digest.update(chunk)
                          stream.write(chunk)
                      stream.flush()
                      os.fsync(stream.fileno())
                  if count != expected_bytes or digest.hexdigest() != expected_sha256:
                      raise AssertionError("Downloaded weight failed size/SHA-256 verification")
                  if target.exists() or target.is_symlink():
                      raise AssertionError("Weight appeared during download; refusing to replace it")
                  os.replace(str(temporary), str(target))
                  return True
              finally:
                  if temporary.exists():
                      temporary.unlink()


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("action", choices=["metadata", "download"])
              args = parser.parse_args()
              if Path.cwd().resolve() != ROOT or os.environ.get("CONDA_DEFAULT_ENV") != "yonod" or sys.version_info[:2] != (3, 9):
                  raise AssertionError("Run from repository root in yonod / Python 3.9")
              support = ROOT / "backup" / "ci-dependency-assets"
              support.mkdir(parents=True, exist_ok=True)
              report = {"platform": sys.platform, "action": args.action, "model_loaded": False}
              try:
                  report["metadata"] = verify_metadata(ROOT)
                  if args.action == "download":
                      assets = ROOT / "WEIGHTS" / "MolMetaLM-base"
                      if assets.is_symlink():
                          raise AssertionError("Asset directory must not be a symlink")
                      url = "https://huggingface.co/" + UPSTREAM_REPOSITORY + "/resolve/" + UPSTREAM_REVISION + "/model.safetensors"
                      report["downloaded_missing_weight"] = download_verified(
                          url, assets / "model.safetensors", DEFAULT_ASSET_SHA256["model.safetensors"], MODEL_BYTES,
                      )
                      report["source_url"] = url
                      report["identity"] = validated_asset_identity(str(assets))
                      report["other_assets"] = []
                      for name, digest, count in OTHER_ASSETS:
                          target = (ROOT / "WEIGHTS").joinpath(*Path(name).parts)
                          if any(part.is_symlink() for part in target.parents if part != ROOT):
                              raise AssertionError("Pretrained asset parent must not be a symlink: " + name)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          source = "https://huggingface.co/" + OTHER_REPOSITORY + "/resolve/" + OTHER_REVISION + "/" + name
                          downloaded = download_verified(source, target, digest, count)
                          report["other_assets"].append({"path": name, "sha256": digest, "source_url": source, "downloaded": downloaded})
                  report["status"] = "passed"
              except Exception as exc:
                  report["status"] = "failed"
                  report["error"] = type(exc).__name__ + ": " + str(exc)
                  raise
              finally:
                  (support / (args.action + ".json")).write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(json.dumps({key: value for key, value in report.items() if key not in {"metadata", "identity"}}, ensure_ascii=False))


          if __name__ == "__main__":
              main()
    - name: '[dependency] verify WEIGHTS bytes and CRLF protection (Bash)'
      if: runner.os != 'Windows'
      shell: bash -el {0}
      run: |
        source "$(conda info --base)/etc/profile.d/conda.sh"
        conda activate yonod
        [ "$CONDA_DEFAULT_ENV" = "yonod" ]
        python _verify/ci_dependency_assets_20261115.py metadata
    - name: Save validation evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: yonod-static-${{ github.sha }}
        path: |
          backup/ci-static/
          backup/ci-dependency-assets/
        retention-days: 7
        if-no-files-found: warn
  smoke-linux:
    name: Linux saved-output acceptance
    needs: static
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/github-remediation-20261115' || github.ref
      == 'refs/heads/codex/dependency-security-20261115' || github.head_ref == 'codex/dependency-security-20261115'
    uses: ./.github/workflows/smoke.yml
    with:
      runner: ubuntu-22.04
      platform: linux
  smoke-windows:
    name: Windows saved-output acceptance
    needs: smoke-linux
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/github-remediation-20261115' || github.ref
      == 'refs/heads/codex/dependency-security-20261115' || github.head_ref == 'codex/dependency-security-20261115'
    uses: ./.github/workflows/smoke.yml
    with:
      runner: windows-2022
      platform: windows
