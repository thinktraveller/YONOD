benchmark:
  dataset_path: ../dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  label_col: yield
  smiles_cols: [reactant_1_smiles, reactant_2_smiles]
  descriptors: [morgan]
  models: [rf, xgb, lightgbm]
  model_params:
    rf: {n_estimators: 10, n_jobs: 1, random_state: 42}
    xgb: {n_estimators: 10, device: cpu, random_state: 42}
    lightgbm: {n_estimators: 20, n_jobs: 1, random_state: 42}
  grouping:
    strategy: component_holdout
    component_cols: [reactant_1_smiles]
    max_group_fraction: 0.5
  cv: {n_repeats: 2, n_splits: 2, seed: 42}
  outputs:
    root: ../results/benchmark-smoke
