# Step 31.6: independent all-stage parity smoke.  It intentionally owns a
# separate artifact and result root from the features -> train two-process run.
schema_version: "2.0"
project_name: step31_6_chemical_vae_all
stage: all

dataset:
  path: ../../dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []
    categoricals: []

descriptors:
  - id: chemical-vae-zinc-v5
    descriptor: chemical_vae
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params:
      model_manifest: ../../WEIGHTS/chemical_vae/zinc-37e96cd3bc8f9680/v5/conversion_manifest.json
      backend: pytorch
      device: cpu
      batch_size: 4
      input_preprocessing: identity
      output: z_mean_sample

artifacts:
  output_dir: ../../derived/chemical_vae/step31_6_smoke/all_artifacts

models: [rf]
model_params:
  rf:
    estimator:
      n_estimators: 16
      max_depth: null
      min_samples_leaf: 1
      max_features: 1.0
      n_jobs: 1
      random_state: 42
      verbose: 0

evaluation:
  protocol: outer_kfold
  n_splits: 2
  n_repeats: 1
  shuffle: true
  seed: 42

outputs:
  root: ../../derived/chemical_vae/step31_6_smoke/all_outputs
  report_formats: [Markdown]

metadata:
  notes: "Step 31.6 all-stage comparison against the independent features -> train run."
