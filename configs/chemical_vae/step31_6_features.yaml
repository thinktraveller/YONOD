# Step 31.6: independent feature-materialisation smoke for the verified ZINC
# Chemical VAE encoder.  Kept separate from example.yaml by design.
schema_version: "2.0"
project_name: step31_6_chemical_vae_features
stage: features

dataset:
  path: ../../dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []
    categoricals: []

descriptors:
  - id: chemical-vae-zinc-v5
    descriptor: chemical_vae
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params:
      model_manifest: ../../WEIGHTS/chemical_vae/zinc-37e96cd3bc8f9680/v5/conversion_manifest.json
      backend: pytorch
      device: cpu
      batch_size: 4
      input_preprocessing: identity
      output: z_mean_sample

artifacts:
  output_dir: ../../derived/chemical_vae/step31_6_smoke/features_artifacts

# stage: features does not produce a model run, but reserves its own root so
# this task cannot collide with the later train/all phases.
outputs:
  root: ../../derived/chemical_vae/step31_6_smoke/features_outputs
  report_formats: [Markdown]

metadata:
  notes: "Step 31.6 features process: verified v5 Chemical VAE, 12-row deterministic fixture."
