# End-to-end feature-stage cold/warm-cache timing for Morgan on the same rows.
schema_version: "2.0"
project_name: step31_7_cost_morgan
stage: features

dataset:
  path: ../../dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []
    categoricals: []

descriptors:
  - id: morgan-ecfp4
    descriptor: morgan
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]

artifacts:
  output_dir: ../../derived/chemical_vae/step31_7_comparison/cost_artifacts/morgan
outputs:
  root: ../../derived/chemical_vae/step31_7_comparison/cost_outputs/morgan
  report_formats: [Markdown]
metadata:
  notes: "Step 31.7 end-to-end cold and warm cache timing; Morgan baseline."
