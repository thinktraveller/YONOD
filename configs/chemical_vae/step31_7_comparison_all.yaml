# Step 31.7 paired CPU comparison.  All candidates receive the same two
# reactant columns, labels, outer folds and RF declaration.  The 12-row input
# was audited in step 31.2: all selected roles are VAE-encodable, so it is the
# strict all-role common subset rather than a concat-with-zero-block score.
schema_version: "2.0"
project_name: step31_7_chemical_vae_paired_comparison
stage: all

dataset:
  path: ../../dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []
    categoricals: []

descriptors:
  - id: chemical-vae-zinc-v5
    descriptor: chemical_vae
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params:
      model_manifest: ../../WEIGHTS/chemical_vae/zinc-37e96cd3bc8f9680/v5/conversion_manifest.json
      backend: pytorch
      device: cpu
      batch_size: 4
      input_preprocessing: identity
      output: z_mean_sample
  - id: morgan-ecfp4
    descriptor: morgan
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
  - id: mfp-r3-count
    descriptor: mfp
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params:
      profile: standard
      radius: 3
      fp_size: 1024

artifacts:
  output_dir: ../../derived/chemical_vae/step31_7_comparison/comparison_artifacts

models: [rf]
model_params:
  rf:
    estimator:
      n_estimators: 16
      max_depth: null
      min_samples_leaf: 1
      max_features: 1.0
      n_jobs: 1
      random_state: 42
      verbose: 0

evaluation:
  protocol: outer_kfold
  n_splits: 2
  n_repeats: 1
  shuffle: true
  seed: 42

outputs:
  root: ../../derived/chemical_vae/step31_7_comparison/comparison_outputs
  report_formats: [Markdown]

metadata:
  notes: "Step 31.7: strict 12-sample, two-reactant common subset; paired VAE/Morgan/MFP RF comparison."
