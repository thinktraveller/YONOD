# Windows CPU handoff configuration for C11.  It has never been executed on a
# Windows host, so this file is a reproducible handoff input rather than proof
# of Windows compatibility.  Its roots are intentionally independent of all
# Linux evidence and are portable repository-relative paths.
schema_version: "2.0"
project_name: step31_9_chemical_vae_zinc_v5_windows_cpu_handoff
stage: all

dataset:
  path: ../../dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []
    categoricals: []

descriptors:
  - id: chemical-vae-zinc-v5-windows-cpu
    descriptor: chemical_vae
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params:
      model_manifest: ../../WEIGHTS/chemical_vae/zinc-37e96cd3bc8f9680/v5/conversion_manifest.json
      backend: pytorch
      device: cpu
      batch_size: 4
      input_preprocessing: identity
      output: z_mean_sample

artifacts:
  output_dir: ../../derived/chemical_vae/step31_9_windows_cpu_handoff/artifacts

models: [rf]
model_params:
  rf:
    estimator:
      n_estimators: 16
      max_depth: null
      min_samples_leaf: 1
      max_features: 1.0
      n_jobs: 1
      random_state: 42
      verbose: 0

evaluation:
  protocol: outer_kfold
  n_splits: 2
  n_repeats: 1
  shuffle: true
  seed: 42

outputs:
  root: ../../derived/chemical_vae/step31_9_windows_cpu_handoff/outputs
  report_formats: [Markdown]

metadata:
  notes: "C11 Windows CPU handoff only. Run on a real Windows host and preserve command/log/artifact evidence before changing not_verified."
