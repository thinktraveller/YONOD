# 复制本文件并替换为可追溯数据列；不要以 CSV 行号作为 sample_id。
# Linux 建模启动：`printf '%s\n' configs/my_benchmark.yaml | python -u yonod.py`
schema_version: "2.0"
project_name: my-strict-benchmark
stage: benchmark
dataset:
  path: ../dataset/your_dataset.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
descriptors:
  - id: morgan
    descriptor: morgan
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params: {}
artifacts:
  # 必须是本任务独有目录，且与 outputs.root 相同。
  output_dir: ../results/my-strict-benchmark
models: [rf, xgb, lightgbm]
model_params: {}
evaluation:
  protocol: manifest_outer_cv
  n_repeats: 2
  n_splits: 2
  seed: 42
  grouping:
    strategy: component_holdout
    component_cols: [reactant_1_smiles]
outputs:
  root: ../results/my-strict-benchmark
benchmark:
  # SQLite 状态位于每个 content-derived run 的 docs/state/，支持安全恢复。
  task_state: {backend: sqlite, resumable: true}
