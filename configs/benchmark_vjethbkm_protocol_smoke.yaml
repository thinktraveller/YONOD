# 论文式 MFP/OHE/RF 随机 CV 协议的最小端到端验收配置。
# 此 fixture 仅检验实现契约，不可用于宣称复现 BH1/BH2/SM/SL1 数值结果。
schema_version: "2.0"
project_name: vjethbkm-protocol-smoke
stage: benchmark
dataset:
  path: ../dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
descriptors:
  - id: mfp
    descriptor: mfp
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params:
      algorithm: morgan_count
      radius: 3
      fp_size: 1024
      input_normalization: raw_csv_value
      blank_or_invalid_component: zero_block_keep_row
      concatenate_in_declared_order: true
  - id: ohe
    descriptor: ohe
    lifecycle: fold_transform
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params:
      encoder: OneHotEncoder
      handle_unknown: ignore
      missing_component: encode_then_zero_component_block
artifacts:
  output_dir: ../results/vjethbkm-protocol-smoke
models: [rf]
model_params:
  rf:
    estimator:
      n_estimators: 500
      max_features: 0.3
      n_jobs: -1
evaluation:
  protocol: manifest_outer_cv
  n_repeats: 5
  n_splits: 5
  seed: 1000
  grouping:
    strategy: repeated_kfold
    source_order: raw_csv
outputs:
  root: ../results/vjethbkm-protocol-smoke
benchmark:
  task_state: {backend: sqlite, resumable: true}
  reproduction_protocol:
    name: vjethbkm_rf_5x5
    literature_doi: 10.1021/jacs.6c02213
    official_implementation: reference-proejct/vjethbkm/yieldsmarter
