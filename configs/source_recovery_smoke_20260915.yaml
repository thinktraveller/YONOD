# Fresh 12-row acceptance run after recovering the deleted source package.
schema_version: "2.0"
project_name: source_recovery_smoke_20260915
stage: all
dataset:
  path: ../dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []
    categoricals: []
descriptors:
  - id: morgan
    descriptor: morgan
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
  - id: maccs
    descriptor: maccs
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
artifacts:
  output_dir: ../derived/source_recovery_smoke_20260915/artifacts
models: [rf]
model_params:
  rf:
    estimator:
      n_estimators: 10
      n_jobs: 19
      random_state: 42
evaluation:
  protocol: outer_kfold
  n_splits: 2
  n_repeats: 1
  shuffle: true
  seed: 42
outputs:
  root: ../derived/source_recovery_smoke_20260915/outputs
  report_formats: [HTML, Markdown]
metadata:
  doi: "10.0000/source-recovery-smoke"
  source_url: "https://example.invalid/benchmark_smoke_fixture.csv"
  notes: "源码恢复验证；12 行测试数据，两个组合；DOI 与 URL 为测试占位符。"
