# Full additive-corrected amide-coupling study.  This configuration is isolated
# from the paused original-data run and is the sole source of its artifacts.
schema_version: "2.0"
project_name: amide-coupling-additive-fixed-full-all-descriptors-all-models
stage: all

dataset:
  path: ../dataset/amide-coupling(additive_fixed).csv
  sample_id_col: row_id
  column_roles:
    label: yield
    reactants: [sub_1_smiles, sub_2_smiles]
    products: [product_smiles]
    others: [activation, additive, base, solvent]
    conditions: []
    categoricals: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]

# Molecular descriptors use the six pre-reaction components. product_smiles is
# exclusive to DRFP, whose reaction representation needs both reaction sides.
descriptors:
  - id: morgan_binary
    descriptor: morgan
    lifecycle: static_descriptor
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params: {}

  - id: mfp_r3_1024_standard
    descriptor: mfp
    lifecycle: static_descriptor
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params: {radius: 3, fp_size: 1024, profile: standard}

  - id: maccs_keys
    descriptor: maccs
    lifecycle: static_descriptor
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params: {}

  - id: fisd_embedding
    descriptor: fisd
    lifecycle: static_descriptor
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params: {}

  - id: molmetalm_embedding
    descriptor: molmetalm
    lifecycle: static_descriptor
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params: {}

  - id: maf_sum
    descriptor: maf
    lifecycle: static_descriptor
    mode: sum
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params: {}

  - id: rdkit2d
    descriptor: rdkit2d
    lifecycle: static_descriptor
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params: {}

  - id: drfp_reaction
    descriptor: drfp
    lifecycle: static_descriptor
    mode: reaction
    columns: [sub_1_smiles, sub_2_smiles, product_smiles]
    extra_reactants: [activation, additive, base, solvent]
    params: {}

  - id: chemical_vae_zinc_v5
    descriptor: chemical_vae
    lifecycle: static_descriptor
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params:
      model_manifest: ../WEIGHTS/chemical_vae/zinc-37e96cd3bc8f9680/v5/conversion_manifest.json
      backend: pytorch
      device: cuda:0
      batch_size: 256
      input_preprocessing: identity
      output: z_mean_sample

  - id: chemical_vae_zinc_properties_v5
    descriptor: chemical_vae
    lifecycle: static_descriptor
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params:
      model_manifest: ../WEIGHTS/chemical_vae/zinc_properties-9f923d03c5ce558d/v5/conversion_manifest.json
      backend: pytorch
      device: cuda:0
      batch_size: 256
      input_preprocessing: identity
      output: z_mean_sample

  - id: ohe_train_fold
    descriptor: ohe
    lifecycle: fold_transform
    mode: concat
    columns: [sub_1_smiles, sub_2_smiles, activation, additive, base, solvent]
    params: {missing_policy: as_category, dtype: float32, handle_unknown: ignore}

models: [rf, xgb, svm, lightgbm, autogluon]
model_params:
  rf:
    estimator:
      n_estimators: 300
      max_features: 1.0
      min_samples_leaf: 1
      n_jobs: 8
      random_state: 42

  xgb:
    estimator:
      n_estimators: 500
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      n_jobs: 8
      random_state: 42
      tree_method: hist
    runtime:
      device_policy: cuda
      early_stopping: {rounds: 50, validation_fraction: 0.1, seed: 42}

  svm:
    estimator: {C: 10.0, epsilon: 0.1, gamma: scale, cache_size: 4096}
    preprocessing:
      scaler: {enabled: true, params: {}}
      pca:
        enabled: true
        feature_threshold: 2048
        params: {n_components: 512, svd_solver: randomized, random_state: 42}
      subsample: {n_samples: 8000, random_state: 42}

  lightgbm:
    estimator:
      n_estimators: 1000
      learning_rate: 0.03
      num_leaves: 63
      subsample: 0.8
      colsample_bytree: 0.8
      n_jobs: 8
      random_state: 42
      verbosity: -1
    runtime:
      early_stopping: {rounds: 50, validation_fraction: 0.1, seed: 42}

  autogluon:
    predictor: {problem_type: regression, eval_metric: root_mean_squared_error, verbosity: 2}
    fit:
      presets: medium_quality_faster_train
      time_limit: 900
      num_cpus: 8
      num_gpus: 0
      save_space: true
    runtime: {cleanup: false}

evaluation:
  protocol: outer_kfold
  n_splits: 5
  n_repeats: 1
  shuffle: true
  seed: 42

artifacts:
  output_dir: ../derived/amide_coupling_additive_fixed_full_all_descriptors_all_models/artifacts

outputs:
  root: ../derived/amide_coupling_additive_fixed_full_all_descriptors_all_models/outputs
  report_formats: [Markdown, HTML]

metadata:
  source_url: "dataset/amide-coupling(additive_fixed).csv"
  notes: >-
    Full 47,015-row amide-coupling task over every current public feature
    provider and every current model adapter. The additive-fixed source repairs
    1,537 malformed additive strings; validation finds zero invalid components
    across all six molecular input fields under YONOD multi-component splitting.
    Static molecular candidates use six pre-reaction component columns;
    product_smiles is used only by DRFP. The two separately verified Chemical
    VAE encoders run on cuda:0, while OHE is fit in each outer training fold.
  requested_by: user
