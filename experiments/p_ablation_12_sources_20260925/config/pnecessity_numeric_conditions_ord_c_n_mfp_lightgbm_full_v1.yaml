  prepared_data_sha256: 50d7b61282b339eb95da97fb0a3635fdbb61a9cb63cfeb031190e57800997587
  raw_data_sha256: ba845e82bb3701469aadf172a7457c64354b1e7d6f8e2ab1aad2b96c2445a012
  molecular_c_execution_policy: A/B and every non-product molecular C are materialised
    as strict molecular inputs; their chemical source roles remain in the parent preparation
