schema_version: '2.0'
project_name: ablation2_formal_mfp_lightgbm_random_repeat_group_full_v1
stage: benchmark
dataset:
  path: ./result/ablation2_amide_data_prep_v1/data/standardized_population.csv
  sample_id_col: sample_id
  column_roles:
    label: yield
    reactants:
    - amine_smiles
    - acid_smiles
    products:
    - product_smiles
    others:
    - activation_smiles
    - additive_smiles
    - base_smiles
    - solvent_smiles
    conditions: []
    categoricals: []
descriptors:
- id: mfp_full
  descriptor: mfp
  lifecycle: static_descriptor
  mode: concat
  columns:
  - amine_smiles
  - acid_smiles
  - product_smiles
  - activation_smiles
  - additive_smiles
  - base_smiles
  - solvent_smiles
  params:
    radius: 3
    fp_size: 1024
    profile: standard
artifacts:
  output_dir: ./result/ablation2_formal_mfp_lightgbm_random_repeat_group_full_v1/feature
models:
- lightgbm
model_params:
  lightgbm:
    estimator:
      n_estimators: 500
      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 1
      random_state: 20260918
      n_jobs: 19
evaluation:
  protocol: manifest_outer_cv
  n_splits: 5
  n_repeats: 3
  seed: 20260918
  grouping:
    strategy: precomputed_column
    group_column: repeat_group_id
  split_manifest: ./result/ablation2_amide_splits_v1/manifests/random_repeat_group_split_manifest.parquet
outputs:
  root: ./result/ablation2_formal_mfp_lightgbm_random_repeat_group_full_v1
  report_formats:
  - html
  - markdown
benchmark:
  task_state:
    backend: sqlite
    resumable: true
  population_id: ablation2_amide_standardized_v1
  dataset_id: ablation2_amide_coupling
metadata:
  notes: 'Pre-registered formal matrix: mfp x lightgbm; random_repeat_group; full.'
