# 随机划分教学示例：12条人工记录，不是实验测量数据。
# 初始只保留输入数据；结果待运行后写入根result/example/random_split_test/。
# 从仓库根启动python yonod.py，首提示输入config/example/random_split_test/run.yaml。
schema_version: "2.0"
project_name: random_split_test
stage: all  # 先准备输入编码，再建立模型并做内测

dataset:
  path: ../../../example/random_split_test/dataset/reactions.csv
  sample_id_col: reaction_id  # 每条反应记录的唯一编号
  column_roles:
    label: yield             # 教学参考产率，0.10表示10%；不作为模型输入
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []           # 本例不使用温度等数值条件
    categoricals: []
  numeric_conditions:
    defaults:
      missing: {strategy: error}
      scaling: none
    columns: {}

descriptors:
  - id: morgan
    descriptor: morgan       # 将分子结构转为数值编码
    mode: concat             # 按列顺序合并两个组分的编码
    columns: [reactant_1_smiles, reactant_2_smiles]

artifacts:
  output_dir: ../../../result/example/random_split_test/feature

models: [rf, xgb, lightgbm]   # 同一数据、同一划分，比较三种建模方法
# 未指定线程数时采用所用模型库的默认值；可按本机资源另设 estimator.n_jobs。
model_params:
  rf:
    estimator:
      n_estimators: 2         # 与历史教学任务相同的小型设置，不是推荐研究参数
      random_state: 42
  xgb:
    estimator:
      n_estimators: 2
      max_depth: 2
      learning_rate: 0.1
      random_state: 42
  lightgbm:
    estimator:
      n_estimators: 2
      num_leaves: 2
      min_child_samples: 1
      random_state: 42

hpo:
  enabled: false             # 不自动比较模型设置，更不优化反应条件

evaluation:
  protocol: outer_kfold      # 随机分批轮换内测
  n_splits: 2                # 分两份，每次6条建模、6条检验，再交换
  n_repeats: 1               # 整套内测只做一次
  shuffle: true              # 划分前打乱记录顺序
  seed: 42                   # 固定打乱方式；不表示未见底物或独立外测

outputs:
  root: ../../../result/example/random_split_test
  report_formats: [html, markdown]
  diagnostics:
    enabled: false           # 与历史报告一致，不另算已学反应效果对照
    save_train_predictions: false

metadata:
  notes: "人工教学数据；结构编码、模型规模与划分来自历史任务diag215_20260929_ordinary_fixed_off_v1；计算线程数采用模型库默认值；配置保存在config/example/random_split_test/run.yaml，从仓库根主入口启动；结果写入仓库根result/example下的独立任务目录。"
