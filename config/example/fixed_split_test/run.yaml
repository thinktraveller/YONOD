# 固定名单两折内测：人工教学数据，用于完整流程测试。
# 从仓库根启动python yonod.py，首提示输入config/example/fixed_split_test/run.yaml。
schema_version: "2.0"
project_name: fixed_split_test
stage: benchmark  # 严格核查并执行预先给定的训练/留出名单

dataset:
  path: ../../../example/fixed_split_test/dataset/reactions.csv
  sample_id_col: reaction_id  # 唯一反应记录编号，不作为模型输入
  column_roles:
    label: yield             # 参考产率：0.10表示10%；本例为人工数值
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []
    categoricals: []
  numeric_conditions:
    defaults:
      missing: {strategy: error}
      scaling: none
    columns: {}

descriptors:
  - id: morgan
    descriptor: morgan       # 结构数值编码（Morgan指纹）
    lifecycle: static_descriptor  # 每条结构可独立计算的编码
    mode: concat             # 按列顺序拼接两个反应物编码
    columns: [reactant_1_smiles, reactant_2_smiles]

artifacts:
  output_dir: ../../../result/example/fixed_split_test/feature

models: [rf]                 # 随机森林回归；只是小型操作示例
# 未指定线程数时采用所用模型库的默认值；可按本机资源另设 estimator.n_jobs。
model_params:
  rf:
    estimator:
      n_estimators: 10       # 教学预算，不是推荐科研参数
      random_state: 42

hpo:
  enabled: false             # 不自动筛选模型设置

evaluation:
  protocol: manifest_outer_cv
  n_splits: 2                # 两折轮换，每条记录恰好留出一次
  n_repeats: 1
  seed: 42                   # 保留运行身份；实际成员由下方名单决定
  grouping:
    strategy: precomputed_column
    group_column: fixed_block  # 仅约束同组不拆开，不输入模型
  split_manifest: ../../../example/fixed_split_test/splits/fixed_split_manifest.csv  # 预先指定每条记录的角色

outputs:
  root: ../../../result/example/fixed_split_test
  report_formats: [html, markdown]
  diagnostics:
    enabled: false
    save_train_predictions: false

benchmark:
  task_state:
    backend: sqlite
    resumable: true
  population_id: teaching_fixed_12_records_v1
  dataset_id: synthetic_fixed_split_teaching_v1

metadata:
  notes: "人工教学数据；固定block_A/block_B名单两折轮换；组名没有化学含义；配置保存在config/example/fixed_split_test/run.yaml，从仓库根主入口启动，执行后在任务结果目录核查报告与运行清单。"
