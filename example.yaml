# 可直接复制的 schema-2 YAML 示例。此文件使用仓库内的小型 fixture，
# 仅运行 Morgan × RF 的 2-fold smoke；项目规模实验应另存配置和输出目录。
# 正式任务：另存为 config/<task_name>.yaml，经 yonod.py 首提示提供该路径。
# 教学示例：在 example/<示例>/ 运行 python ../../yonod.py，首提示输入 run.yaml。
schema_version: "2.0"
project_name: yonod_schema2_smoke
stage: all  # features 仅生成编码；train 另需 artifacts.input_manifest；all 先编码后内测。

dataset:
  path: ./dataset/benchmark_smoke_fixture.csv
  sample_id_col: reaction_id
  column_roles:
    label: yield
    reactants: [reactant_1_smiles, reactant_2_smiles]
    products: []
    others: []
    conditions: []
    categoricals: []
  # conditions 按这里的源列顺序进入模型；空列表时无需 numeric_conditions。
  # 非空时可用 columns.<源列名> 覆盖 name、missing_values、missing、scaling、unit。
  # missing: {strategy: error|mean|median|constant, constant: <有限数值>}
  # scaling: none|standard|minmax。unit 显式声明 source、target、scale、offset，
  # 目标值 = 原始值 * scale + offset；省略 unit 即无量纲。
  numeric_conditions:
    defaults:
      missing: {strategy: error}
      scaling: none
    columns: {}

# 每项均是单独的特征候选；不同描述符不会自动拼接。
# Morgan 为逐条可计算的 static_descriptor；ohe 使用 fold_transform，逐训练折拟合。
descriptors:
  - id: morgan
    descriptor: morgan
    lifecycle: static_descriptor
    mode: concat
    columns: [reactant_1_smiles, reactant_2_smiles]
    params: {}  # 仅声明该 descriptor 支持的参数；Morgan 无可配置参数。

artifacts:
  output_dir: ./result/yonod_schema2_smoke/feature

models: [rf]
model_params:
  # 仅声明 models 中所选模型的区段；未写参数使用受支持安装版本的库默认。
  # RF/XGBoost/LightGBM 的 estimator.n_jobs 和 AutoGluon 的 fit.num_cpus 均设为 19。
  # 在单项任务内部使用这些 CPU；任务、描述符组合及 CV 折均按顺序执行。
  rf:
    estimator:
      n_estimators: 10
      max_depth: null
      min_samples_leaf: 1
      max_features: 1.0
      n_jobs: 19
      random_state: 42
      verbose: 0

# HPO 缺省关闭；固定参数 smoke 不需要安装 Optuna。开启时必须显式写出
# models、sampler、seed、objective、inner_cv、budget、search_spaces。
# hpo.models 只能包含顶层 models 中的 rf/xgb/lightgbm；其他模型仍按固定参数运行。
# 每个 feature × model × outer fold 独立搜索，inner-fold 指标取算术平均。
# study_timeout_s/task_timeout_s 是可选软上限，当前 trial 可完成。
hpo:
  enabled: false
# 下面是开启 RF 搜索的字段规范；请复制到独立 config/<task>.yaml，
# 同时更改 project_name 并隔离 result/<task_name>/ 及其 feature/ 路径。
# hpo:
#   enabled: true
#   models: [rf]
#   sampler: tpe
#   seed: 42
#   objective: {metric: rmse, direction: minimize}
#   inner_cv: {n_splits: 3, seed: 42, shuffle: true}
#   budget: {max_trials: 20}
#   search_spaces:
#     rf:
#       preset: compact-v1
#       parameters: {}  # 可按同名参数整体覆盖分布
#   final_model: {enabled: false}
# 分布只支持 type=int/float/categorical 与安全 low/high/step/log/choices。
# final_model 开启时另需 development_population_id 和独立 budget.max_trials。

evaluation:
  # 普通 all/train 按随机 KFold 轮换内测；固定种子不代表未见底物或独立外测。
  # 固定名单需 stage: benchmark + manifest_outer_cv 和 split_manifest，
  # 见 example/fixed_split/run.yaml；固定设置的外测协议见 example/external_test/run.yaml。
  # 切换专用协议时须采用其完整字段，不能只改 protocol 字符串。
  protocol: outer_kfold
  n_splits: 2
  n_repeats: 1
  shuffle: true
  seed: 42

outputs:
  root: ./result/yonod_schema2_smoke
  report_formats: [html, markdown]
  diagnostics:
    enabled: true
    save_train_predictions: false
metadata:
  notes: "12条人工 fixture 的小型可运行 smoke，只验证流程。正式研究请使用独立 YAML、任务名、特征包和输出根目录。"
